apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Two connectors to the same tunnel: while one reconnects, Cloudflare sends visitors to the other.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          # http2 runs over TCP 7844, the path checked from this server before installing.
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # The Secret is created by hand so the token never enters this public repo.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          # /healthcheck only asks whether cloudflared is running. /ready also needs the tunnel
          # connected, and restarting cloudflared while it reconnects only starts the wait over.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Not ready while the tunnel is down, which kube-state-metrics shows and alerts on.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
