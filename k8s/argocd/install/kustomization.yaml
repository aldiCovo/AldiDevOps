apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml

# MetalLB's only IP belongs to Traefik, so the UI uses a NodePort.
patches:
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
