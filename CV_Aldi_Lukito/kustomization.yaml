apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cv

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The ConfigMap name gets a hash of default.conf, so a changed config restarts the Pod.
configMapGenerator:
  - name: nginx-config
    files:
      - default.conf

# The build in aldiCovo/cv-aldi-lukito writes newTag, the commit the image was built from.
images:
  - name: ghcr.io/aldicovo/cv-aldi-lukito
    newTag: "63dcacf"
