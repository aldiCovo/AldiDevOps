apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: ghcr.io/aldicovo/search-service
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_URL
              value: http://catalog-service.catalog.svc:8080
            # The Secret is created by hand so the passwords never enter this public repo.
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: search-service
                  key: elasticsearch-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: search-service
                  key: rabbitmq-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
