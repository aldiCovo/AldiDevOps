apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      # Prometheus reads /metrics on this port, which no Service routes.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
      labels:
        app: admin-service
    spec:
      # The owner of the photos folder on AldiServer, so admin-service can write there.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: admin-service
          image: ghcr.io/aldicovo/admin-service
          ports:
            - containerPort: 8080
          env:
            - name: USER_URL
              value: http://user-service.user.svc:8080
            - name: ORDER_URL
              value: http://order-service.order.svc:8080
            - name: CATALOG_URL
              value: http://catalog-service.catalog.svc:8080
            # The Secrets are created by hand so the tokens never enter this public repo.
            - name: USER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-user-token
                  key: token
            - name: ORDER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-order-token
                  key: token
            - name: CATALOG_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-catalog-token
                  key: token
            - name: USER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-user-admin-token
                  key: token
            - name: PHOTOS_DIR
              value: /photos
          volumeMounts:
            - name: photos
              mountPath: /photos
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: admin-photos
