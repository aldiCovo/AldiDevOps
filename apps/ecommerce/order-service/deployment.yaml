apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      # Prometheus reads /metrics on this port, which no Service routes.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/aldicovo/order-service
          ports:
            - containerPort: 8080
          env:
            # The Secret is created by hand so the password never enters this public repo.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-database
                  key: url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: order-rabbitmq
                  key: url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: order-nats
                  key: url
            - name: CATALOG_URL
              value: http://catalog-service.catalog.svc:8080
            - name: USER_URL
              value: http://user-service.user.svc:8080
            # Lets admin-service use the /internal routes.
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: order-internal-token
                  key: token
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
