apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik
  rules:
    - host: prastika.aldiab.ai.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
---
# Separate from the Ingress above, because a middleware applies to a whole Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-auth
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: web-auth-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: prastika.aldiab.ai.id
      http:
        paths:
          - path: /api/login
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /api/register
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 8080
---
