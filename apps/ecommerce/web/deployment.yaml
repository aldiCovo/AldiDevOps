apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/aldicovo/web
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_URL
              value: http://catalog-service.catalog.svc:8080
            - name: SEARCH_URL
              value: http://search-service.search.svc:8080
            - name: USER_URL
              value: http://user-service.user.svc:8080
            - name: ORDER_URL
              value: http://order-service.order.svc:8080
            - name: REALTIME_URL
              value: http://realtime-service.realtime.svc:8080
            - name: CART_URL
              value: http://cart-service.cart.svc:8080
            - name: PHOTOS_DIR
              value: /photos
          volumeMounts:
            - name: photos
              mountPath: /photos
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: web-photos
            readOnly: true
