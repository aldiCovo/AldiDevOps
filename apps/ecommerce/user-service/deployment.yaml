apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      # Prometheus reads /metrics on this port, which no Service routes.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/aldicovo/user-service
          ports:
            - containerPort: 8080
          env:
            # The Secrets are created by hand so the password and key never enter this public repo.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-database
                  key: url
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: user-service-jwt
                  key: private-key
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: user-internal-token
                  key: token
            # Lists accounts and changes roles; only admin-service has it.
            - name: ADMIN_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: user-admin-token
                  key: token
            # Reset links go out through Mailpit, which catches every email and delivers none.
            # Brevo's relay delivers to real inboxes; the domain aldiab.ai.id is authenticated
            # there (DKIM, DMARC in Cloudflare). The login is the Secret mail-brevo, made by hand.
            - name: SMTP_ADDR
              value: smtp-relay.brevo.com:587
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-brevo
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-brevo
                  key: password
            - name: MAIL_FROM
              value: Prastika Fashion <no-reply-prastikafashion@aldiab.ai.id>
            # Customers' replies reach the shop mailbox, which Cloudflare forwards.
            - name: MAIL_REPLY_TO
              value: Prastika Fashion <prastikafashion@aldiab.ai.id>
            # The start of each reset link.
            - name: SHOP_URL
              value: https://prastika.aldiab.ai.id
            # Google login. The secret is required, so a rollout without it stays on the old Pod
            # instead of starting one that refuses to run. Create it first:
            # kubectl -n user create secret generic user-google --from-literal=client-secret=GOCSPX-...
            - name: GOOGLE_CLIENT_ID
              value: 441375500995-bpmf4697vnjgdk11mam5ubkbvcbpf86u.apps.googleusercontent.com
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-google
                  key: client-secret
            # WhatsApp codes through Fonnte; without the secret phones just can't be verified.
            # kubectl -n user create secret generic user-fonnte --from-literal=token=...
            - name: FONNTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: user-fonnte
                  key: token
                  optional: true
            # Password hashes make a lot of garbage, so Go must collect it before the limit below.
            - name: GOMEMLIMIT
              value: 200MiB
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
