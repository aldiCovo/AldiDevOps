apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the ecommerce Application in ArgoCD deploys. A new service only needs a line here.
# The tools in this folder are applied by hand, so that a sync can never touch their data.
resources:
  - catalog-service
  - search-service
  - user-service
  - order-service
  - payment-service
  - realtime-service
  - notification-service
  - web
