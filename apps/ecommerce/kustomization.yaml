apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the ecommerce Application in ArgoCD deploys. A new service only needs a line here.
resources:
  - postgresql
  - rabbitmq
  - elasticsearch
  - nats
  - mailpit
  - catalog-service
  - search-service
  - user-service
  - order-service
  - payment-service
  - realtime-service
  - notification-service
  - cart-service
  - chat-service
  - web
  - admin-service
  - web-admin
  - monitoring

# Tools start before the services that need them. ArgoCD never deletes these objects, even if
# they leave Git or the Application is deleted, because their data can't be rebuilt from Git.
# A new tool needs its name added here. This only changes the objects' own annotations, so it
# doesn't restart any Pod.
patches:
  - target:
      name: (postgresql|rabbitmq|elasticsearch|nats|mailpit|monitoring|prometheus|grafana|loki)(-.*)?
    patch: |-
      apiVersion: v1
      kind: Protected
      metadata:
        name: protected
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
