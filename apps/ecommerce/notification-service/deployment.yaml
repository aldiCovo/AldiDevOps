# Reads order events and sends email; chat-service also asks it for chat emails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      # Prometheus reads /metrics on this port, which no Service routes.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/aldicovo/notification-service
          ports:
            - containerPort: 8080
          env:
            # The Secrets are created by hand so the passwords never enter this public repo.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-database
                  key: url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: notification-rabbitmq
                  key: url
            - name: USER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-user-token
                  key: token
            - name: USER_URL
              value: http://user-service.user.svc:8080
            # Brevo's relay delivers to real inboxes; the domain aldiab.ai.id is authenticated
            # there (DKIM, DMARC in Cloudflare). The login is the Secret mail-brevo, made by hand.
            - name: SMTP_ADDR
              value: smtp-relay.brevo.com:587
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-brevo
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-brevo
                  key: password
            - name: MAIL_FROM
              value: Prastika Fashion <no-reply@aldiab.ai.id>
            # Customers' replies reach the shop mailbox, which Cloudflare forwards.
            - name: MAIL_REPLY_TO
              value: Prastika Fashion <prastikafashion@aldiab.ai.id>
            # chat-service's token for emails about unread chat answers; the route is off
            # without it. The same value is in chat-notify-token in namespace chat.
            - name: CHAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-chat-token
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
