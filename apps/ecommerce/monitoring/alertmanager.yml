# Where alerts go. The bot token and the chat ID come from the alertmanager-telegram Secret,
# and the Healthchecks.io ping address from alertmanager-heartbeat. Both are made by hand
# (see the README), so none of them is in Git.
route:
  receiver: telegram
  # Alerts that start together arrive in one message.
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  # Still broken after this long, say so again.
  repeat_interval: 4h
  routes:
    # The heartbeat, every minute or two, never to Telegram.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [severity="warning"]
      receiver: telegram
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/token
        chat_id_file: /etc/alertmanager/telegram/chat_id
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "telegram.aldi" . }}'

  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/heartbeat/url
        send_resolved: false

templates:
  - /etc/alertmanager/config/*.tmpl
