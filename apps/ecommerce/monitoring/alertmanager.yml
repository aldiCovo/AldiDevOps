# Where alerts go. The bot token and the chat ID come from the alertmanager-telegram Secret,
# which is made by hand (see the README), so neither is in Git.
route:
  receiver: telegram
  # Alerts that start together arrive in one message.
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  # Still broken after this long, say so again.
  repeat_interval: 4h
  routes:
    - matchers: [severity="warning"]
      receiver: telegram
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram/token
        chat_id_file: /etc/alertmanager/telegram/chat_id
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "telegram.aldi" . }}'

templates:
  - /etc/alertmanager/config/*.tmpl
