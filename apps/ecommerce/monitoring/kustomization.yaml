apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - prometheus.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - grafana.yaml

# Each name gets a hash of its files, so a change restarts the Pod that reads them.
configMapGenerator:
  - name: scrape-config
    namespace: monitoring
    files:
      - prometheus.yml
  - name: datasources
    namespace: monitoring
    files:
      - provisioning/prometheus.yaml
  - name: dashboard-providers
    namespace: monitoring
    files:
      - provisioning/dashboards.yaml
  - name: dashboards
    namespace: monitoring
    files:
      - dashboards/server.json
      - dashboards/kubernetes.json
