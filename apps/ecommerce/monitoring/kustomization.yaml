apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - prometheus.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - grafana.yaml
  - exporters.yaml
  - alertmanager.yaml
  - loki.yaml
  - alloy.yaml

# Each name gets a hash of its files, so a change restarts the Pod that reads them.
# Prometheus, Grafana and Loki sync in wave -1 with the other tools, so the files they mount must
# exist by then too, or ArgoCD waits forever for them to become healthy.
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
configMapGenerator:
  - name: scrape-config
    namespace: monitoring
    files:
      - prometheus.yml
  - name: alert-rules
    namespace: monitoring
    files:
      - alert-rules.yml
  - name: alertmanager-config
    namespace: monitoring
    files:
      - alertmanager.yml
      - telegram.tmpl
  - name: datasources
    namespace: monitoring
    files:
      - provisioning/prometheus.yaml
      - provisioning/loki.yaml
  - name: dashboard-providers
    namespace: monitoring
    files:
      - provisioning/dashboards.yaml
  - name: dashboards
    namespace: monitoring
    files:
      - dashboards/server.json
      - dashboards/kubernetes.json
      - dashboards/toko.json
      - dashboards/log.json
      - dashboards/saham.json
  - name: blackbox-config
    namespace: monitoring
    files:
      - blackbox.yml
  - name: loki-config
    namespace: monitoring
    files:
      - loki.yml
  - name: loki-rules
    namespace: monitoring
    files:
      - log-alert-rules.yml
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy
