apiVersion: 1
providers:
  # The dashboards come from this repo. Changes made in Grafana's pages can't be saved over
  # them, so the repo stays the only place they change.
  - name: aldi
    folder: AldiServer
    type: file
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /var/lib/grafana-dashboards
