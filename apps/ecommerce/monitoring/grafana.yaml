apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  # Its database is one SQLite file, which two Grafanas must never open at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # A new hostPath folder belongs to root, and Grafana runs as user 472.
      initContainers:
        - name: fix-data-owner
          image: grafana/grafana:13.2.5
          command: ["chown", "-R", "472:0", "/var/lib/grafana"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.aldiab.ai.id
            # Read only when Grafana creates its database, on the first start. Later changes
            # are made in Grafana's own pages, or with grafana cli admin reset-admin-password.
            # The Secret is created by hand so the password never enters this public repo.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            # The address is public, so nobody may sign up or look without logging in.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_SECURITY_CONTENT_SECURITY_POLICY
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
          resources:
            # It used 310Mi of a 384Mi limit right after its first start.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: datasources
        - name: dashboard-providers
          configMap:
            name: dashboard-providers
        - name: dashboards
          configMap:
            name: dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.aldiab.ai.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# Grafana locks an account after repeated wrong passwords. This also limits guessing per visitor.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-login
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-login-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.aldiab.ai.id
      http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# Everything reaches Traefik from cloudflared, so the visitor's address must come from the
# header Cloudflare sets, or all visitors would share one limit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-rate-limit
  namespace: monitoring
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
