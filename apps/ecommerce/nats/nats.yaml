# Each user can only do its own job: order-service sends signals and realtime-service reads
# them. The passwords come from the Secret, so they never enter this public repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    max_payload: 4KB
    authorization {
      users: [
        {
          user: order
          password: $ORDER_PASSWORD
          permissions: {
            publish: { allow: "orders.*" }
            subscribe: { deny: ">" }
          }
        }
        {
          user: realtime
          password: $REALTIME_PASSWORD
          permissions: {
            publish: { deny: ">" }
            subscribe: { allow: "orders.*" }
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
# No volume: core NATS keeps no messages, because the order status is in PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: nats
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: nats
          image: nats:2.15.2-alpine3.22
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          env:
            - name: ORDER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-passwords
                  key: order
            - name: REALTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-passwords
                  key: realtime
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: nats-config
